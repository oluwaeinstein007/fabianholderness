    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FinancialService",
        "name": "Fabian Holderness",
        "url": "%SITE_URL%/",
        "logo": "%SITE_URL%/favicon.svg",
        "image": "%SITE_URL%/images/hero-skyline.jpg",
        "description": "Asset management and investment house blending AI-assisted research with disciplined, relationship-driven advisory services.",

        "email": "info@fabianholderness.com",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Los Angeles",
          "addressRegion": "CA",
          "addressCountry": "US"
        },
        "openingHoursSpecification": {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
          "opens": "08:00",
          "closes": "16:00"
        }
      }

    <script>
      (function () {
        var stored = localStorage.getItem('fh-theme');
        var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
